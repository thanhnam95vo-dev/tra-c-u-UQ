<style>
:root{--p:#005baa;--p2:#0086d1;--bg:#eef4f9;--txt:#182435;--muted:#69798e;--line:#dbe5ee;--good:#0b8b4d;--shadow:0 12px 30px rgba(0,66,112,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 16px 30px}
.wrap{max-width:1180px;margin:auto}
.header-main{display:flex;align-items:center;justify-content:space-between;gap:18px}
.header-copy small{font-weight:800;opacity:.9}
h1{font-size:26px;margin:7px 0 5px}
.updated{display:inline-block;margin-top:9px;background:rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.logo{width:118px;height:82px;object-fit:contain;background:#fff;border-radius:16px;padding:8px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
main{max-width:1180px;margin:-14px auto 40px;padding:0 12px}
.search{display:flex;gap:8px;background:#fff;padding:13px;border-radius:17px;box-shadow:var(--shadow);position:sticky;top:7px;z-index:20}
.search input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.search button{border:0;border-radius:12px;padding:0 15px;font-weight:900;cursor:pointer;color:var(--p);background:#e8f3fb}
h2{font-size:19px;margin:22px 3px 11px}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.group-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;transition:.18s}
.group-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.group-card.active{outline:3px solid rgba(0,91,170,.18);border-color:#77b7df}
.group-card small{display:block;color:var(--muted);font-weight:800}
.group-card strong{display:block;font-size:27px;color:var(--p);margin:7px 0 3px}
.group-card span{font-size:12px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.sum-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}
.sum-card small{display:block;color:var(--muted);font-weight:800}
.sum-card b{display:block;color:var(--p);font-size:22px;margin-top:5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 2px 9px}
.toolbar strong{color:var(--p)}
.reset{border:0;border-radius:999px;background:#e8f3fb;color:var(--p);font-weight:900;padding:9px 12px;cursor:pointer}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.point{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.point-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.point-name{font-size:15px;font-weight:900;line-height:1.35}
.area{font-size:12px;color:var(--muted);margin-top:5px}
.pill{flex:none;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
.pro{background:#e4f1ff;color:#075faa} .plus{background:#e6f8ed;color:#087740} .basic{background:#fff0dc;color:#a75a00}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.metric{background:#f7fafc;border-radius:11px;padding:10px}
.metric small{display:block;color:var(--muted);font-size:10px;font-weight:800}
.metric b{display:block;font-size:15px;margin-top:5px;word-break:break-word}
.money{color:var(--good)}
.empty{background:#fff;border:1px dashed #b9c9d7;border-radius:16px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{text-align:center;color:#7b8999;font-size:12px;margin-top:24px}
@media(max-width:760px){.list{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){h1{font-size:20px}.logo{width:76px;height:58px}.group-grid{grid-template-columns:1fr 1fr 1fr;gap:6px}.group-card{padding:11px 8px}.group-card strong{font-size:21px}.group-card span{font-size:10px}.summary{grid-template-columns:1fr 1fr 1fr;gap:6px}.sum-card{padding:10px 7px}.sum-card b{font-size:16px}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

let activeGroup="all";
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat("vi-VN").format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const label=g=>g==="pro"?"Pro":g==="plus"?"Plus":"Basic";

function updateCounts(){
  $("countPro").textContent=DATA.filter(x=>x.group==="pro").length;
  $("countPlus").textContent=DATA.filter(x=>x.group==="plus").length;
  $("countBasic").textContent=DATA.filter(x=>x.group==="basic").length;
}

function render(){
  const q=$("q").value.trim().toLocaleLowerCase("vi");
  let rows=DATA.filter(x=>(activeGroup==="all"||x.group===activeGroup) && (!q || x.name.toLocaleLowerCase("vi").includes(q)));
  rows.sort((a,b)=>b.subs-a.subs || b.revenue-a.revenue || a.name.localeCompare(b.name,"vi"));
  $("resultTitle").textContent=(activeGroup==="all"?"Tất cả Điểm ủy quyền":"Nhóm "+label(activeGroup))+" · "+rows.length+" điểm";
  $("sumSubs").textContent=fmt(rows.reduce((s,x)=>s+x.subs,0));
  $("sum70").textContent=fmt(rows.reduce((s,x)=>s+x.subs70,0));
  $("sumRevenue").textContent=fmt(rows.reduce((s,x)=>s+x.revenue,0))+"đ";
  document.querySelectorAll(".group-card").forEach(b=>b.classList.toggle("active",b.dataset.group===activeGroup));
  $("list").innerHTML=rows.length?rows.map(x=>`
    <article class="point">
      <div class="point-head">
        <div><div class="point-name">${esc(x.name)}</div><div class="area">📍 ${esc(x.area)}</div></div>
        <span class="pill ${x.group}">${label(x.group)}</span>
      </div>
      <div class="metrics">
        <div class="metric"><small>Thuê bao PTM</small><b>${fmt(x.subs)}</b></div>
        <div class="metric"><small>PTM từ 70k</small><b>${fmt(x.subs70)}</b></div>
        <div class="metric"><small>Doanh thu</small><b class="money">${fmt(x.revenue)}đ</b></div>
      </div>
    </article>`).join(""):`<div class="empty">Không tìm thấy Điểm ủy quyền phù hợp.</div>`;
}
document.querySelectorAll(".group-card").forEach(b=>b.onclick=()=>{activeGroup=b.dataset.group;render();window.scrollTo({top:document.querySelector(".summary").offsetTop-90,behavior:"smooth"})});
$("reset").onclick=()=>{activeGroup="all";$("q").value="";render()};
$("clear").onclick=()=>{$("q").value="";render()};
$("q").addEventListener("input",render);
updateCounts();render();
</script>
