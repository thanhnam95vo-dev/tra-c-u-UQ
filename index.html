<style>
:root{--blue:#005baa;--cyan:#00a9e0;--bg:#f3f7fb;--text:#17324d;--muted:#61758a;--card:#fff;--border:#d9e5ef}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eaf5ff 0,#f7fbff 180px,#f3f7fb 100%);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue),#0078c8 65%,var(--cyan));color:white;padding:22px 16px 28px}
.wrap{max-width:760px;margin:auto}
h1{font-size:24px;margin:0 0 7px;line-height:1.25}
.sub{opacity:.92;font-size:14px;line-height:1.45}
main{padding:0 14px 28px;margin-top:-15px}
.panel{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(0,70,130,.13);padding:15px}
.search{position:relative}
.search input{width:100%;font-size:17px;padding:15px 46px 15px 15px;border:1.5px solid #b9d4e8;border-radius:13px;outline:none;color:var(--text);background:#fff}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,169,224,.12)}
.clear{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:10px;background:#eef5fa;font-size:20px;color:#557085}
.help{font-size:12px;color:var(--muted);margin:9px 2px 2px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0 5px}
.stat{border:1px solid var(--border);border-radius:12px;padding:9px 7px;text-align:center;background:#fbfdff}
.stat b{display:block;font-size:20px;color:var(--blue)}
.stat span{font-size:11px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);margin:13px 2px 9px}
.results{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px;box-shadow:0 3px 12px rgba(37,77,112,.06)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.name{font-weight:700;font-size:16px;line-height:1.35;color:#123b60;word-break:break-word}
.badge{flex:none;font-size:12px;font-weight:700;padding:6px 9px;border-radius:999px;white-space:nowrap}
.pro{background:#dceeff;color:#005baa}
.plus{background:#dff8eb;color:#087a47}
.basic{background:#fff0d8;color:#a35a00}
.grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:11px;font-size:13px}
.row{display:grid;grid-template-columns:105px 1fr;gap:8px}
.label{color:var(--muted)}
.value{font-weight:600;word-break:break-word}
.empty{text-align:center;padding:28px 12px;color:var(--muted);line-height:1.5}
footer{text-align:center;font-size:11px;color:#8193a4;padding:6px 10px 25px}
@media(min-width:600px){h1{font-size:29px} .grid{grid-template-columns:1fr 1fr} .row.unit{grid-column:1/-1}}
</style>
</head>

const q=document.getElementById('q'), results=document.getElementById('results'), statusEl=document.getElementById('status');
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function cls(g){let n=norm(g);return n.includes('pro')?'pro':n.includes('plus')?'plus':'basic';}
function render(){
 const term=norm(q.value);
 if(!term){results.innerHTML='<div class="empty">Nhập tên hoặc mã cần tìm ở ô phía trên.</div>';statusEl.textContent='Tổng cộng 229 điểm ủy quyền';return;}
 const words=term.split(/\s+/).filter(Boolean);
 const found=DATA.filter(x=>{const hay=norm([x.name,x.id,x.hrm,x.unit,x.group].join(' '));return words.every(w=>hay.includes(w));}).slice(0,100);
 statusEl.textContent=found.length?`Tìm thấy ${found.length} kết quả${found.length===100?' đầu tiên':''}`:'Không tìm thấy kết quả';
 results.innerHTML=found.length?found.map(x=>`<article class="card">
 <div class="top"><div class="name">${esc(x.name)}</div><span class="badge ${cls(x.group)}">${esc(x.group)}</span></div>
 <div class="grid">
 <div class="row unit"><div class="label">Đơn vị</div><div class="value">${esc(x.unit)}</div></div>
 <div class="row"><div class="label">ID HRM</div><div class="value">${esc(x.hrm)}</div></div>
 <div class="row"><div class="label">ID điểm bán</div><div class="value">${esc(x.id)}</div></div>
 </div></article>`).join(''):'<div class="empty">Không có điểm ủy quyền phù hợp.<br>Thử nhập một phần tên hoặc mã.</div>';
}
q.addEventListener('input',render);
document.getElementById('clear').addEventListener('click',()=>{q.value='';q.focus();render();});
render();
</script>
